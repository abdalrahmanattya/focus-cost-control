name: azure-destroy
on:
  workflow_dispatch:
    inputs:
      confirm: {description: 'Type DESTROY-APPROVED', required: true, type: string}
permissions: {contents: read, id-token: write}
concurrency: {group: focus-azure-production, cancel-in-progress: false}
jobs:
  destroy:
    if: ${{ inputs.confirm == 'DESTROY-APPROVED' }}
    runs-on: ubuntu-latest
    environment: azure-production
    env:
      TF_VAR_enable_apply: "true"
      TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}
      TF_VAR_web_image: ${{ vars.WEB_IMAGE }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_entra_tenant_id: ${{ secrets.ENTRA_TENANT_ID }}
      TF_VAR_entra_spa_client_id: ${{ secrets.ENTRA_SPA_CLIENT_ID }}
      TF_VAR_entra_api_client_id: ${{ secrets.ENTRA_API_CLIENT_ID }}
      TF_VAR_entra_operator_group_id: ${{ secrets.ENTRA_OPERATOR_GROUP_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/azure init -input=false -backend-config=resource_group_name="${{ vars.TF_STATE_RESOURCE_GROUP }}" -backend-config=storage_account_name="${{ vars.TF_STATE_STORAGE_ACCOUNT }}" -backend-config=container_name="${{ vars.TF_STATE_CONTAINER }}" -backend-config=key="${{ vars.TF_STATE_KEY }}" -backend-config=use_oidc=true
      - id: target
        run: echo "resource_group=$(terraform -chdir=infra/azure output -raw resource_group)" >> "$GITHUB_OUTPUT"
      - run: terraform -chdir=infra/azure destroy -input=false -auto-approve -var="container_image=$TF_VAR_container_image" -var="web_image=$TF_VAR_web_image" -var="postgres_admin_password=$TF_VAR_postgres_admin_password"
      - run: test "$(az group exists --name "${{ steps.target.outputs.resource_group }}")" = "false"
