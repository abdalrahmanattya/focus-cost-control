name: ci
on: [push, pull_request]
permissions: {contents: read, security-events: write}
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e '.[test]'
      - run: PYTHONPATH=src pytest -q
      - run: python -m compileall -q src
  dashboard:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/azure init -backend=false -input=false
      - run: terraform -chdir=infra/azure fmt -check -recursive
      - run: terraform -chdir=infra/azure validate
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: '.', scanners: vuln, format: table, exit-code: '1', ignore-unfixed: true}
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root image
        run: docker build --tag focus-cost-control:ci .
      - name: Verify image user and health
        run: |
          test "$(docker image inspect focus-cost-control:ci --format '{{.Config.User}}')" = "appuser"
          docker run --detach --name focus-api -p 18080:8000 focus-cost-control:ci
          trap 'docker rm --force focus-api' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18080/health && exit 0 || sleep 1; done
          exit 1
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: focus-cost-control:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: focus-cost-control:ci
          artifact-name: focus-cost-control-sbom.spdx.json
          output-file: focus-cost-control-sbom.spdx.json
          format: spdx-json
      - uses: actions/upload-artifact@v4
        with: {name: focus-cost-control-sbom, path: focus-cost-control-sbom.spdx.json, retention-days: 7}
      - name: Build dashboard image
        run: docker build --tag focus-cost-control-web:ci web
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: focus-cost-control-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: focus-cost-control-web:ci
          artifact-name: focus-cost-control-web-sbom.spdx.json
          output-file: focus-cost-control-web-sbom.spdx.json
          format: spdx-json
      - uses: actions/upload-artifact@v4
        with: {name: focus-cost-control-web-sbom, path: focus-cost-control-web-sbom.spdx.json, retention-days: 7}
