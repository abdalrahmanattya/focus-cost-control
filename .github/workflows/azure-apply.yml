name: azure-apply
on:
  workflow_dispatch:
    inputs:
      confirm: {description: 'Type APPLY-APPROVED', required: true, type: string}
      image: {description: 'Immutable container image digest', required: true, type: string}
      web_image: {description: 'Immutable web image digest', required: true, type: string}
permissions: {contents: read, id-token: write}
concurrency: {group: focus-azure-production, cancel-in-progress: false}
jobs:
  apply:
    if: ${{ inputs.confirm == 'APPLY-APPROVED' }}
    runs-on: ubuntu-latest
    environment: azure-production
    env:
      TF_VAR_enable_apply: "true"
      TF_VAR_container_image: ${{ inputs.image }}
      TF_VAR_web_image: ${{ inputs.web_image }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_entra_tenant_id: ${{ secrets.ENTRA_TENANT_ID }}
      TF_VAR_entra_spa_client_id: ${{ secrets.ENTRA_SPA_CLIENT_ID }}
      TF_VAR_entra_api_client_id: ${{ secrets.ENTRA_API_CLIENT_ID }}
      TF_VAR_entra_operator_group_id: ${{ secrets.ENTRA_OPERATOR_GROUP_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/azure init -input=false -backend-config=resource_group_name="${{ vars.TF_STATE_RESOURCE_GROUP }}" -backend-config=storage_account_name="${{ vars.TF_STATE_STORAGE_ACCOUNT }}" -backend-config=container_name="${{ vars.TF_STATE_CONTAINER }}" -backend-config=key="${{ vars.TF_STATE_KEY }}" -backend-config=use_oidc=true
      - run: terraform -chdir=infra/azure plan -input=false -lock-timeout=5m -out=tfplan -var="container_image=$TF_VAR_container_image" -var="web_image=$TF_VAR_web_image" -var="postgres_admin_password=$TF_VAR_postgres_admin_password"
      - run: terraform -chdir=infra/azure apply -input=false -auto-approve tfplan
      - id: migration
        run: |
          RG=$(terraform -chdir=infra/azure output -raw resource_group)
          JOB=$(terraform -chdir=infra/azure output -raw migration_job)
          az containerapp job start --name "$JOB" --resource-group "$RG"
          for attempt in $(seq 1 30); do
            status=$(az containerapp job execution list --name "$JOB" --resource-group "$RG" --query '[0].properties.status' -o tsv)
            case "$status" in
              Succeeded) echo "migration=succeeded" >> "$GITHUB_OUTPUT"; exit 0 ;;
              Failed|Degraded) echo "migration=$status"; exit 1 ;;
            esac
            sleep 10
          done
          echo 'migration timed out'; exit 1
      - id: outputs
        run: echo "web_url=$(terraform -chdir=infra/azure output -raw web_url)" >> "$GITHUB_OUTPUT"
      - run: printf '%s\n' '{"web_url":"redacted-derived-output","apply":"completed"}' > azure-apply-evidence.json
      - uses: actions/upload-artifact@v4
        with: {name: azure-apply-evidence, path: azure-apply-evidence.json, retention-days: 7}
